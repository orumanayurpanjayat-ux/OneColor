name: Build PLK110 image-specific OneOS overlays

on:
  push:
    branches:
      - redesign/guest-experience-refresh
    paths:
      - '.github/workflows/plk110-overlays.yml'
      - 'scripts/build-plk110-overlays.sh'
      - 'scripts/test-plk110-overlay-builder.py'
      - 'scripts/test-oplus-boot-hangs.py'
      - 'scripts/make-overlays.sh'
      - 'scripts/patch-built-jar.sh'
      - 'switcher/patches/oplus_boot_hangs.py'
      - 'switcher/patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneos-plk110-overlays-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-plk110-overlays:
    name: Rebuild guarded patches from the exact PLK110 GSI
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install patch build tools
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends e2fsprogs unzip zip file curl

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          sdkmanager --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'build-tools;37.0.0' \
            'platform-tools'

          mkdir -p "$RUNNER_TEMP/oneos"
          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' \
            --output "$RUNNER_TEMP/oneos/apktool_3.0.3.jar"
          printf '%s  %s\n' \
            'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423' \
            "$RUNNER_TEMP/oneos/apktool_3.0.3.jar" | sha256sum --check --status
          echo "APKTOOL=$RUNNER_TEMP/oneos/apktool_3.0.3.jar" >> "$GITHUB_ENV"

          keytool -genkeypair -keystore "$RUNNER_TEMP/oneos/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 \
            -validity 10000 -noprompt
          echo "KEYSTORE=$RUNNER_TEMP/oneos/debug.keystore" >> "$GITHUB_ENV"

      - name: Test PLK110 image-bound builder
        run: |
          set -Eeuo pipefail
          python3 scripts/test-plk110-overlay-builder.py
          python3 scripts/test-oplus-boot-hangs.py
          bash -n scripts/build-plk110-overlays.sh
          bash -n scripts/patch-built-jar.sh

      - name: Build overlays from PLK110 image
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/plk110-overlays"
          bash scripts/build-plk110-overlays.sh "$OUT" 2>&1 | tee "$RUNNER_TEMP/plk110-builder.log"
          echo "PLK110 overlay output: $OUT"
          echo '### PLK110 image-specific overlay build' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'The pinned ZIP and system image hashes passed. Patches and APEX payloads were rebuilt from the PLK110 image; see the attached manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/plk110-overlays.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PLK110 builder diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          {
            echo '### PLK110 builder diagnostics'
            echo
            if [[ -s "$RUNNER_TEMP/plk110-builder.log" ]]; then
              echo '#### Last 160 builder log lines'
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/plk110-builder.log"
              echo '```'
            else
              echo 'The builder log was not created.'
            fi
            echo
            echo '#### Runner disk space'
            echo '```text'
            df -h "$RUNNER_TEMP" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PLK110 overlay build
        uses: actions/upload-artifact@v7
        with:
          name: OneOS-PLK110-overlays-${{ github.sha }}
          path: ${{ runner.temp }}/plk110-overlays/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload builder diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: OneOS-PLK110-builder-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/plk110-builder.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
